# nginx reverse proxy for the telemetry platform.
#   - serves the built Angular dashboard,
#   - proxies /api and /healthz to the Express server,
#   - upgrades /ws to the WebSocket server.
# Obtain TLS certs via certbot (or use Caddy for automatic HTTPS).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name telemetry.example.com;
  # Redirect everything to HTTPS (except ACME challenges).
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name telemetry.example.com;

  ssl_certificate     /etc/letsencrypt/live/telemetry.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/telemetry.example.com/privkey.pem;

  # --- Angular dashboard (static build output) ---
  root /var/www/telemetry-dashboard;
  index index.html;

  # Security headers, applied to every response (no location sets its own
  # add_header). CSP is the key control for the token model: script-src 'self'
  # blocks injected inline scripts and connect-src 'self' blocks exfiltrating
  # the localStorage dashboard token to another origin. HSTS is safe here since
  # this block is the TLS terminator.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ /index.html;   # SPA fallback
  }

  # --- REST API + health ---
  location ~ ^/(api|healthz) {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- WebSocket (live compute metrics) ---
  location /ws {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;   # keep long-lived sockets open
  }
}
