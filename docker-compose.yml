# Full single-host stack: Postgres + telemetry server + dashboard (nginx).
# One command brings everything up: `docker compose up -d --build`.
# Only the `web` service is published (port 80); server + postgres stay on the
# internal network. The server auto-migrates on boot.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
      POSTGRES_DB: telemetry
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://telemetry:${POSTGRES_PASSWORD:-telemetry}@postgres:5432/telemetry
      # Dashboard is same-origin behind nginx, so CORS can stay closed (or set it).
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Single shared secret gating all read/admin endpoints + the WebSocket.
      # REQUIRED: if unset, those routes fail closed (503). Set it in .env.
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
      # Optional usage workers — leave blank to disable.
      ANTHROPIC_ADMIN_KEY: ${ANTHROPIC_ADMIN_KEY:-}
      GEMINI_BILLING_TABLE: ${GEMINI_BILLING_TABLE:-}
      # Google Calendar time analytics. Paths point at the mounted ./server/config
      # dir below; the worker stays disabled until the token + calendars files exist.
      GOOGLE_CALENDAR_CREDENTIALS_PATH: ${GOOGLE_CALENDAR_CREDENTIALS_PATH:-./config/google-credentials.json}
      GOOGLE_CALENDAR_TOKEN_PATH: ${GOOGLE_CALENDAR_TOKEN_PATH:-./config/google-token.json}
      GOOGLE_CALENDARS_FILE: ${GOOGLE_CALENDARS_FILE:-./config/calendars.json}
      CALENDAR_TIMEZONE: ${CALENDAR_TIMEZONE:-America/Vancouver}
    # Exposed only inside the compose network (not published to the host).
    expose:
      - "4000"
    # Mount the calendar worker's secrets (OAuth token/client + real calendar IDs)
    # by path — read-only — rather than baking them into the image layer.
    volumes:
      - ./server/config:/app/config:ro

  web:
    build: ./dashboard
    restart: unless-stopped
    depends_on:
      - server
    ports:
      # Host port is configurable (WEB_PORT in .env); container always serves on 80.
      - "${WEB_PORT:-80}:80"

volumes:
  pgdata:
